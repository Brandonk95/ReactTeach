<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 16px; color: #1f2328; background: #fff; line-height: 1.5; }
      button { font: inherit; padding: 4px 12px; margin: 2px; cursor: pointer; }
      input, select, textarea { font: inherit; padding: 4px 8px; }
      .card { border: 1px solid #d0d7de; border-radius: 8px; padding: 12px 16px; margin: 8px 0; }
      .badge { background: #cf222e; color: #fff; border-radius: 999px; padding: 0 8px; font-size: 0.85em; margin-left: 6px; }
      .done { text-decoration: line-through; color: #6e7781; }
      #__test-area { position: absolute; left: -10000px; top: 0; width: 800px; }
      .__crash { color: #cf222e; background: #ffebe9; border: 1px solid #ff8182; border-radius: 6px; padding: 12px; font-family: ui-monospace, monospace; white-space: pre-wrap; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="__test-area" aria-hidden="true"></div>
    <script type="module" src="/src/sandbox/sandbox.jsx"></script>
  </body>
</html>
